<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism — Глоссарий (Мобильная версия)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/glossary_mobile.css">
    <link rel="stylesheet" href="css/achievements.css">
    <link rel="icon" type="png" href="textures/icon.png">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gemini: {
                            bg: 'var(--color-bg)',
                            card: 'var(--color-card)',
                            cardHover: 'var(--color-card-hover)',
                            border: 'var(--color-border)',
                            text: 'var(--color-text)',
                            textMuted: 'var(--color-text-muted)',
                            modalFooter: 'var(--color-modal-footer)',
                            blue: '#8ab4f8',
                            purple: '#c58af9',
                        },
                        quiz: {
                            pink: '#E8B4D8',
                            dark: '#12111A'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gemini-bg text-gemini-text font-sans min-h-screen antialiased select-none pb-8">

    <div id="page-transition" style="position: fixed; inset: 0; z-index: 99999; background-color: #f97316; transform: translateY(0); transition: transform 0.6s cubic-bezier(0.76, 0, 0.24, 1); pointer-events: none;"></div>

    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10 opacity-40" id="bgAbstractions">
        <div class="absolute top-[-10%] left-[-5%] w-[60vw] h-[60vw] rounded-full bg-gemini-purple/10 blur-[80px]"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-[60vw] h-[60vw] rounded-full bg-gemini-blue/10 blur-[80px]"></div>
    </div>

    <div id="mainGlossaryScreen" class="w-full px-4 pt-6 flex flex-col gap-5">

        <header class="flex justify-between items-center pb-4 border-b border-white/5">
            <a href="index_mobile.html" class="px-4 py-2 rounded-full bg-neutral-900/80 border border-white/10 text-[11px] font-bold uppercase tracking-wider text-white active:scale-95 transition-all">
                ← На главную
            </a>
            <button id="openQuizBtn" class="px-4 py-2 rounded-full text-[11px] font-bold bg-quiz-pink text-quiz-dark active:scale-95 transition-all flex items-center gap-1.5 shadow-md shadow-quiz-pink/10">
                <i data-lucide="trophy" class="w-3.5 h-3.5"></i>
                Викторина
            </button>
        </header>

        <div class="flex flex-col gap-3">
            <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gemini-textMuted">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </div>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Найти термин или формулу..."
                    class="w-full bg-neutral-900/90 border border-white/5 rounded-2xl py-3.5 pl-10 pr-4 text-sm text-white placeholder-neutral-600 focus:outline-none focus:border-gemini-purple/50 transition-all font-sans"
                >
            </div>

            <div class="flex gap-1.5 p-1 bg-neutral-900/80 border border-white/5 rounded-full overflow-x-auto no-scrollbar">
                <div class="flex gap-1.5" id="filterContainer"></div>
            </div>
        </div>

        <div class="py-1 border-y border-white/5 overflow-x-auto no-scrollbar" id="alphabetWrapper">
            <div class="flex gap-1.5" id="alphabetContainer"></div>
        </div>

        <div class="flex flex-col gap-3">
            <h2 id="gridTitle" class="text-lg font-bold tracking-wider text-white uppercase px-1">Популярные темы</h2>
            <div id="glossaryGrid" class="grid grid-cols-1 gap-3 pb-8"></div>
        </div>

        <div id="noResults" class="hidden text-center py-20 text-gemini-textMuted">
            <i data-lucide="search-x" class="w-12 h-12 mx-auto mb-3 opacity-40 text-gemini-purple"></i>
            <p class="text-base font-semibold">Ничего не найдено</p>
            <p class="text-xs text-neutral-500 mt-1">Попробуйте изменить поисковый запрос.</p>
        </div>
    </div>

    <div id="quizGameScreen" class="fixed inset-0 bg-neutral-950/95 backdrop-blur-md z-40 flex items-center justify-center p-4 hidden">
        <div class="w-full max-h-[90vh] bg-neutral-900/90 border border-white/10 rounded-3xl p-5 shadow-2xl flex flex-col justify-between overflow-y-auto">

            <div class="flex items-center justify-between pb-4 mb-4 border-b border-white/5">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-quiz-pink/10 rounded-xl text-quiz-pink">
                        <i data-lucide="gamepad-2" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white uppercase">Викторина</h2>
                        <p class="text-[9px] text-neutral-500">Угадай научный термин</p>
                    </div>
                </div>
                <button id="exitQuizBtn" class="px-3.5 py-1.5 rounded-lg text-[10px] font-semibold text-neutral-400 bg-neutral-950 border border-white/5 active:bg-white/5 active:text-white transition-all flex items-center gap-1.5">
                    Выйти
                </button>
            </div>

            <div class="flex items-center justify-between gap-4 mb-4">
                <div class="text-xs text-neutral-400">Счёт: <span id="gameScoreLabel" class="font-bold text-quiz-pink">0</span></div>
                <div id="gameStreakContainer" class="hidden flex items-center gap-1 text-[10px] text-yellow-500 font-bold bg-yellow-500/10 px-2.5 py-1 rounded-lg border border-yellow-500/10">
                    <i data-lucide="flame" class="w-3 h-3 fill-yellow-500"></i>
                    Серия: <span id="gameStreakVal">0</span>
                </div>
            </div>

            <div class="p-4 bg-neutral-950 border border-white/5 rounded-2xl mb-4">
                <span class="text-[9px] font-bold text-quiz-pink uppercase tracking-widest block mb-1">Вопрос:</span>
                <p id="gameQuestionText" class="text-xs leading-relaxed text-neutral-200 italic font-light"></p>
            </div>

            <div id="gameOptionsGrid" class="grid grid-cols-1 gap-2.5"></div>

            <div id="gameFeedbackBlock" class="hidden mt-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2">
                <i id="gameFeedbackIcon" class="w-4 h-4"></i>
                <span id="gameFeedbackText"></span>
            </div>

            <div class="flex items-center justify-end gap-2.5 mt-5 pt-4 border-t border-white/5">
                <button id="showTermBtn" class="hidden flex-1 py-3 rounded-xl text-[11px] font-bold text-gemini-blue bg-gemini-blue/5 border border-gemini-blue/10 active:bg-gemini-blue/15 transition-all text-center">
                    Показать термин
                </button>
                <button id="nextQuestionBtn" class="hidden flex-1 py-3 rounded-xl text-[11px] font-bold bg-quiz-pink text-quiz-dark active:scale-95 transition-all text-center">
                    Далее
                </button>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="fixed inset-0 bg-neutral-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-neutral-900 border border-white/10 rounded-3xl w-full max-h-[85vh] overflow-hidden shadow-2xl flex flex-col">

            <div class="p-5 border-b border-white/5 flex justify-between items-start">
                <div>
                    <span id="modalCategory" class="px-2.5 py-0.5 rounded-full text-[9px] font-semibold uppercase tracking-wider border border-white/10 mb-2 inline-block"></span>
                    <h3 id="modalTerm" class="text-xl font-bold text-white"></h3>
                </div>
                <button id="closeModalBtn" class="text-neutral-500 active:text-white p-1 text-lg">✕</button>
            </div>

            <div class="p-5 space-y-5 overflow-y-auto custom-scrollbar flex-1">
                <div id="modalFormulaBlock" class="p-4 rounded-xl bg-neutral-950 border border-white/5 flex flex-col gap-2">
                    <span class="text-[9px] font-bold text-gemini-blue uppercase tracking-widest block">Формула / Состав</span>
                    <span id="modalFormula" class="text-lg text-white font-serif bg-neutral-900/60 px-4 py-2.5 rounded-lg border border-white/5 block w-fit"></span>
                </div>

                <div id="modalVariablesBlock" class="space-y-2 hidden">
                    <h4 class="text-[10px] font-bold text-gemini-blue uppercase tracking-widest">Переменные</h4>
                    <div id="modalVariablesList" class="grid grid-cols-1 gap-2"></div>
                </div>

                <div class="space-y-1.5">
                    <h4 class="text-[10px] font-bold text-gemini-purple uppercase tracking-widest">Суть</h4>
                    <p id="modalDefinition" class="text-neutral-300 font-light text-xs leading-relaxed text-justify"></p>
                </div>

                <div id="modalDynamicBlock" class="p-4 rounded-xl bg-neutral-950 border border-white/5"></div>
            </div>

            <div class="p-4 border-t border-white/5 bg-neutral-900 flex justify-end">
                <button id="bottomCloseBtn" class="w-full py-3 rounded-xl bg-neutral-800 text-white text-xs font-semibold active:bg-neutral-700 transition-colors">
                    Закрыть тему
                </button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/glossary-data.js"></script>
    <script src="js/glossary_mobile.js"></script>
    <script src="js/achievements.js"></script>
</body>
</html>
