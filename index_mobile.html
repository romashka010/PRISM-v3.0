
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism — Главная (Мобильная версия)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index_mobile.css">
    <link rel="stylesheet" href="css/achievements.css">
</head>
<body class="relative bg-black min-h-screen flex flex-col justify-between py-8 px-5">
    <canvas id="bubble-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-10 opacity-30"></canvas>
    <div class="fixed inset-0 w-full h-full pointer-events-none z-20 opacity-[0.02] bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
    <div id="glow-bg" class="ambient-glow"></div>

    <header class="relative z-30 w-full flex justify-between items-center pb-6 border-b border-white/5">
        <div class="font-display text-xl font-black tracking-widest text-white select-none">
            PRISM
        </div>
        <div class="text-[9px] uppercase tracking-[0.2em] text-neutral-500 font-bold">
            Mobile Edition
        </div>
    </header>

    <main class="relative z-30 my-auto py-8 flex flex-col items-center text-center">
        <div class="floating-prism w-44 h-44 flex items-center justify-center relative mb-6">
            <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-[0_0_15px_rgba(255,255,255,0.05)]">
                <defs>
                    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                        <stop offset="40%" stop-color="#a855f7" stop-opacity="0.6"/>
                        <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#f97316" stop-opacity="0.8"/>
                    </linearGradient>
                </defs>
                <polygon points="100,20 170,150 30,150" fill="none" stroke="url(#prismGrad)" stroke-width="2" />
                <line x1="100" y1="20" x2="100" y2="150" stroke="url(#prismGrad)" stroke-width="1.2" stroke-dasharray="3 3"/>
            </svg>
        </div>

        <h1 class="font-display text-3xl font-black tracking-wider text-white mb-2 uppercase">PRISM</h1>
        <p class="text-neutral-400 text-xs tracking-wider max-w-xs leading-relaxed mb-8">
            Исследование фундаментальных основ Вселенной с вашего экрана
        </p>

        <div class="w-full space-y-3.5 max-w-sm">
            <div class="mobile-menu-strip strip-glow-physics" onclick="triggerTransition('Физика', 'physics.html', '#a855f7')">
                <div class="text-left">
                    <div class="text-[9px] font-mono text-purple-400/60 uppercase tracking-widest mb-0.5">SEC_01</div>
                    <div class="font-display text-base font-bold text-white uppercase">Физика</div>
                </div>
                <span class="text-2xl">⚛️</span>
            </div>

            <div class="mobile-menu-strip strip-glow-space" onclick="triggerTransition('Космос', 'kosmos.html', '#06b6d4')">
                <div class="text-left">
                    <div class="text-[9px] font-mono text-cyan-400/60 uppercase tracking-widest mb-0.5">SEC_02</div>
                    <div class="font-display text-base font-bold text-white uppercase">Космос</div>
                </div>
                <span class="text-2xl">🪐</span>
            </div>

            <div class="mobile-menu-strip strip-glow-alchemy" onclick="triggerTransition('Алхимия', 'alchemy_mobile.html', '#10b981')">
                <div class="text-left">
                    <div class="text-[9px] font-mono text-emerald-400/60 uppercase tracking-widest mb-0.5">SEC_03</div>
                    <div class="font-display text-base font-bold text-white uppercase">Алхимия</div>
                </div>
                <span class="text-2xl">🧬</span>
            </div>

            <div class="mobile-menu-strip strip-glow-glossary" onclick="triggerTransition('Глоссарий', 'glossary_mobile.html', '#f97316')">
                <div class="text-left">
                    <div class="text-[9px] font-mono text-orange-400/60 uppercase tracking-widest mb-0.5">SEC_04</div>
                    <div class="font-display text-base font-bold text-white uppercase">Глоссарий</div>
                </div>
                <span class="text-2xl">📖</span>
            </div>
        </div>

        <button onclick="openContactModal()" class="mt-8 px-6 py-3 rounded-full border border-white/10 text-neutral-400 hover:text-white text-xs font-bold uppercase tracking-wider transition-colors active:bg-white/5">
            Связаться с нами
        </button>
    </main>

    <footer class="relative z-30 w-full text-center border-t border-white/5 pt-4">
        <span class="text-[9px] font-mono text-neutral-600 uppercase tracking-widest">PRISM | 2026 • MOBILE PORT</span>
    </footer>

    <div id="contact-modal" class="mobile-contact-overlay">
        <div class="mobile-contact-card">
            <button onclick="closeContactModal()" class="float-right text-neutral-500 active:text-white text-xl p-1">✕</button>

            <div id="contact-form-container">
                <h4 class="font-display text-lg font-bold uppercase text-white mb-6">Обратная связь</h4>
                <form id="prism-contact-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-mono uppercase tracking-wider text-neutral-500 mb-1">Имя</label>
                        <input type="text" id="form-name" required placeholder="Ваше имя..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-rose-500/50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-mono uppercase tracking-wider text-neutral-500 mb-1">Почта</label>
                        <input type="email" id="form-email" required placeholder="name@gmail.com..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-rose-500/50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-mono uppercase tracking-wider text-neutral-500 mb-1">Сообщение</label>
                        <textarea id="form-message" required rows="3" placeholder="Ваше сообщение..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-rose-500/50 resize-none"></textarea>
                    </div>
                    <button type="submit" id="form-submit-btn" class="w-full py-3.5 rounded-xl bg-white text-black active:bg-rose-500 active:text-white text-xs font-bold uppercase tracking-wider transition-all">
                        Отправить письмо
                    </button>
                </form>
            </div>

            <div id="contact-success-container" class="hidden text-center py-6">
                <div class="text-rose-400 text-3xl mb-4">✓</div>
                <h5 class="font-display text-base font-bold uppercase text-white mb-2">Отправлено</h5>
                <p class="text-xs text-neutral-400 leading-relaxed mb-6">
                    В новой вкладке открылся почтовый клиент для завершения отправки.
                </p>
                <button onclick="closeContactModal()" class="px-6 py-2.5 rounded-full border border-neutral-800 text-xs text-neutral-400 active:text-white transition-colors">
                    Назад
                </button>
            </div>
        </div>
    </div>

    <div id="toast-message" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-500 bg-neutral-950 border border-neutral-900 text-white px-6 py-4 rounded-lg flex items-center gap-3 shadow-[0_10px_40px_rgba(0,0,0,0.8)] pointer-events-none">
        <span id="toast-icon" class="text-lg"></span>
        <span id="toast-text" class="text-xs font-mono uppercase tracking-wider"></span>
    </div>

    <script src="js/utils.js" defer></script>
    <script src="js/index_mobile.js" defer></script>
    <script src="js/achievements.js" defer></script>
</body>
</html>
