        * {
            box-sizing: border-box;
            margin: 0;

        body {
            background-color: #121214;
            color: #eeeeee;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .error-wrapper {
            display: flex;
            max-width: 1200px;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            padding: 40px;
            gap: 40px;
        }

        .error-info {
            flex: 1;
            min-width: 300px;
            z-index: 2;
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            color: #FF5C97;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 92, 151, 0.2);
        }

        .error-message {
            font-size: 24px;
            line-height: 1.5;
            color: #b3b3b3;
            margin-bottom: 40px;
            max-width: 450px;
        }

        .btn-home {
            display: inline-block;
            padding: 14px 30px;
            background: transparent;
            color: #EDA11B;
            border: 2px solid #EDA11B;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(237, 161, 27, 0.1);
        }

        .btn-home:hover {
            background: #EDA11B;
            color: #121214;
            box-shadow: 0 0 25px rgba(237, 161, 27, 0.4);
            transform: translateY(-2px);
        }

        .error-animation {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 1199px) {
          .animation-img {
            width: 100%;
          }
        }

        @media (max-width: 991px) {
          .animation-img {
            width: 440px;
          }
          .error-wrapper {
              flex-direction: column-reverse;
              text-align: center;
              justify-content: center;
          }
          .error-message {
              margin: 0 auto 30px auto;
          }
        }

        @media (max-width: 425px) {
          .animation-img {
            width: 300px;
          }
          .error-code {
              font-size: 80px;
          }
          .error-message {
              font-size: 18px;
          }
        }

        .blinkingIL{
          animation: blinkingLight 1100ms infinite;
        }

        @keyframes blinkingLight {
          0% { fill: rgb(247, 189, 97, 1) }
          49% { fill: rgb(252, 250, 131) }
          100% { fill: rgb(247, 189, 97, 1) }
        }

        .blinkingIR {
          animation: blinkingLight 1100ms infinite;
          animation-delay: .5s;
        }

        .blinkingOL {
          animation: blinkingLight3 1100ms infinite;
        }

        @keyframes blinkingLight3 {
          0% { fill: rgb(237, 161, 27) }
          49% { fill: rgb(255, 210, 70) }
          100% { fill: rgb(237, 161, 27) }
        }

        .blinkingOR {
          animation: blinkingLight3 1100ms infinite;
          animation-delay: .5s;
        }

        .blinking4 {
          animation: blinkingLight4 1.2s infinite;
        }

        @keyframes blinkingLight4 {
          0% { fill: rgb(158, 42, 42) }
          49% { fill: rgb(255, 72, 72) }
          100% { fill: rgb(158, 42, 42) }
        }

        .blinking5 {
          animation: blinkingLight5 1.2s infinite;
        }

        @keyframes blinkingLight5 {
          0% { fill: rgb(255, 72, 72) }
          49% { fill: rgb(158, 42, 42) }
          100% { fill: rgb(255, 72, 72) }
        }

        .flash-white {

        }

          0% { fill: rgb(255, 255, 255) }
          49% { fill: rgb(255, 255, 255, 0.5) }
          100% { fill: rgb(255, 255, 255) }
        }
