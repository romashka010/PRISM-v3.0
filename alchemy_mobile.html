<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism — Алхимия (Мобильная версия)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="png" href="textures/icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/alchemy_mobile.css">
    <link rel="stylesheet" href="css/achievements.css">
</head>
<body class="relative min-h-screen bg-black flex flex-col justify-between py-6 px-4 select-none">

    <canvas id="bubble-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-10 opacity-25"></canvas>
    <div id="glow-bg" class="ambient-glow"></div>

    <header class="relative z-30 w-full flex justify-between items-center pb-4 border-b border-white/5">
        <a href="index_mobile.html" class="px-5 py-2.5 rounded-full bg-neutral-900/80 border border-white/10 text-xs font-bold uppercase tracking-wider text-white active:scale-95 transition-all">
            ← На главную
        </a>
        <div class="text-right">
            <h1 class="font-display text-lg font-black tracking-widest text-white">PRISM</h1>
            <p class="text-[8px] font-mono text-emerald-400 uppercase tracking-wider">SEC_03 // SYNTHESIS</p>
        </div>
    </header>

    <main class="relative z-30 flex-grow flex flex-col gap-5 my-4">

        <section class="bg-neutral-950/70 border border-white/5 rounded-3xl p-5 flex flex-col justify-between relative overflow-hidden shrink-0">
            <div class="flex justify-between items-center mb-4">
                <span class="text-[10px] font-mono text-emerald-400 font-bold uppercase tracking-wider">Реактор синтеза</span>
                <button onclick="clearReactor()" class="text-[10px] font-mono text-rose-400 font-bold uppercase tracking-wider active:underline">Очистить</button>
            </div>

            <div class="flex justify-center items-center gap-6 py-4 relative">
                <div id="slot-1" onclick="resetSlot(1)" class="w-20 h-20 rounded-full border border-white/10 bg-neutral-900/80 flex flex-col items-center justify-center cursor-pointer transition-all duration-300">
                    <span class="text-3xl"></span>
                    <span class="text-[8px] font-mono text-neutral-500 uppercase mt-1">Слот 1</span>
                </div>

                <span class="text-xl text-neutral-500 font-mono font-light">+</span>

                <div id="slot-2" onclick="resetSlot(2)" class="w-20 h-20 rounded-full border border-white/10 bg-neutral-900/80 flex flex-col items-center justify-center cursor-pointer transition-all duration-300">
                    <span class="text-3xl"></span>
                    <span class="text-[8px] font-mono text-neutral-500 uppercase mt-1">Слот 2</span>
                </div>
            </div>

            <div id="reaction-panel" class="w-full py-3.5 mt-2 rounded-2xl bg-neutral-900/40 border border-white/5 flex items-center justify-center px-4 text-center">
                <div id="reaction-message" class="text-[10px] font-mono tracking-widest text-neutral-400 uppercase font-bold">
                    Выберите два элемента ниже
                </div>
            </div>
        </section>

        <section class="flex-grow bg-neutral-950/70 border border-white/5 rounded-3xl p-5 flex flex-col justify-between overflow-hidden">
            <div class="flex flex-col gap-3 mb-4">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-mono text-neutral-400 uppercase tracking-widest">Элементы на складе</span>
                    <span class="text-[10px] font-mono text-white font-bold"><span id="counter">4</span> / <span id="total-items">45</span></span>
                </div>

                <div class="flex gap-1.5 p-1 bg-neutral-900/80 border border-white/5 rounded-full overflow-x-auto no-scrollbar">
                    <button onclick="filterInventory('all')" id="filter-all" class="tab-btn px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider text-black bg-white shrink-0">Все</button>
                    <button onclick="filterInventory('tier1')" id="filter-tier1" class="tab-btn px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider text-neutral-500 shrink-0">Базовые</button>
                    <button onclick="filterInventory('tier2')" id="filter-tier2" class="tab-btn px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider text-neutral-500 shrink-0">Природа</button>
                    <button onclick="filterInventory('tier3')" id="filter-tier3" class="tab-btn px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider text-neutral-500 shrink-0">Высшие</button>
                </div>
            </div>

            <div class="overflow-y-auto pr-1 flex-grow max-h-[32vh] custom-scroll" id="inventory-container">
                <div id="inventory" class="grid grid-cols-3 gap-2.5">
                </div>
            </div>

            <div id="info-screen" class="mt-4 p-3 rounded-2xl bg-neutral-900/50 border border-white/5 flex items-center gap-3.5">
                <div id="info-icon" class="text-3xl w-12 h-12 bg-neutral-950 border border-white/5 rounded-xl flex items-center justify-center shrink-0">🧬</div>
                <div class="text-left">
                    <div id="info-name" class="text-[10px] font-mono text-emerald-400 font-bold uppercase tracking-wider">Анализатор Prism</div>
                    <div id="info-desc" class="text-[11px] text-neutral-400 leading-normal mt-0.5">Выберите молекулу для сканирования</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="relative z-30 w-full text-center border-t border-white/5 pt-3">
        <span class="text-[8px] font-mono text-neutral-600 uppercase tracking-widest">PRISM // REACTION ENGINE v2.1</span>
    </footer>

    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-500 bg-neutral-950 border border-neutral-900 text-white px-6 py-4 rounded-lg flex items-center gap-3 shadow-[0_10px_40px_rgba(0,0,0,0.8)] pointer-events-none">
        <span id="toast-icon" class="text-lg"></span>
        <span id="toast-text" class="text-xs font-mono uppercase tracking-wider"></span>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/alchemy-data.js"></script>
    <script src="js/alchemy_mobile.js"></script>
    <script src="js/achievements.js"></script>
</body>
</html>
